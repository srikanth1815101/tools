            </div>
          </div>
        </div>
        <a href="{{ "about.html" | relURL }}" class="flex items-center gap-2 text-base font-semibold text-gray-700 hover:text-blue-600 px-2 py-1 rounded transition-colors">
          <i data-lucide="info" class="w-5 h-5 text-indigo-600"></i>
          About

        <a href="{{ "contact.html" | relURL }}" class="flex items-center gap-2 text-base font-semibold text-gray-700 hover:text-blue-600 px-2 py-1 rounded transition-colors">
          <i data-lucide="mail" class="w-5 h-5 text-red-600"></i>

        <a href="{{ "sitemap.html" | relURL }}" class="flex items-center gap-2 text-base font-semibold text-gray-700 hover:text-blue-600 px-2 py-1 rounded transition-colors">
          <i data-lucide="network" class="w-5 h-5 text-orange-600"></i>

      <button id="mobileMenuBtn" class="md:hidden flex items-center justify-center w-10 h-10 rounded-lg text-gray-700 hover:bg-gray-100 focus:outline-none transition-colors" aria-label="Open menu">
        <i data-lucide="menu" class="w-6 h-6"></i>
      </button>
    </nav>
    <!-- New Mobile Menu -->
    <div id="mobileMenu" class="md:hidden fixed inset-0 bg-white z-50 transform translate-x-full transition-transform duration-300 ease-in-out">
      <div class="flex flex-col h-full">
        <!-- Mobile Menu Header -->
        <div class="flex items-center justify-end p-4 border-b" style="background: linear-gradient(90deg, rgba(124,58,237,0.08) 0%, rgba(37,99,235,0.08) 100%); backdrop-filter: blur(8px);">
          <button id="mobileMenuCloseBtn" class="p-2 rounded-lg text-gray-700" aria-label="Close menu" style="display: flex; justify-content: flex-end;">
            <i data-lucide="x" class="w-6 h-6"></i>
          </button>
        </div>
        
        <!-- Mobile Menu Content -->
        <div class="flex-1 overflow-y-auto" style="background: linear-gradient(90deg, rgba(124,58,237,0.08) 0%, rgba(37,99,235,0.08) 100%); backdrop-filter: blur(8px);">
          <div class="p-4 space-y-2">
            <a href="{{ "index.html" | relURL }}" class="flex items-center px-4 py-3 text-gray-700 hover:bg-gray-50 rounded-lg transition-colors">
              <i data-lucide="home" class="w-5 h-5 mr-3 text-blue-600"></i>
              Home
            </a>
            <a href="{{ "favourite-tools.html" | relURL }}" class="w-full flex items-center px-4 py-3 text-gray-700 hover:bg-gray-50 rounded-lg transition-colors">
              <i data-lucide="star" class="w-5 h-5 mr-3 text-yellow-500"></i>
              Favourites
            </a>
            <button id="mobileCategoriesBtn" class="w-full flex items-center px-4 py-3 text-gray-700 hover:bg-gray-50 rounded-lg transition-colors">
              <i data-lucide="grid" class="w-5 h-5 mr-3 text-purple-600"></i>
              Categories
              <i data-lucide="chevron-down" class="w-5 h-5 ml-auto transition-transform"></i>
            </button>
            <div id="mobileCategoriesDropdown" class="hidden pl-4 space-y-2 mt-2">
              <a href="{{ "categories/image-tools.html" | relURL }}" class="flex items-center gap-2 px-4 py-2 rounded-lg hover:bg-green-100 transition-colors"><i data-lucide="image" class="w-5 h-5 text-green-600"></i> Image Tools</a>
              <a href="{{ "categories/text-tools.html" | relURL }}" class="flex items-center gap-2 px-4 py-2 rounded-lg hover:bg-blue-100 transition-colors"><i data-lucide="type" class="w-5 h-5 text-blue-600"></i> Text Tools</a>
              <a href="{{ "categories/developer-tools.html" | relURL }}" class="flex items-center gap-2 px-4 py-2 rounded-lg hover:bg-orange-100 transition-colors"><i data-lucide="code" class="w-5 h-5 text-orange-600"></i> Developer Tools</a>
              <a href="{{ "categories/math-calculators.html" | relURL }}" class="flex items-center gap-2 px-4 py-2 rounded-lg hover:bg-red-100 transition-colors"><i data-lucide="calculator" class="w-5 h-5 text-red-600"></i> Math & Calculators</a>
              <a href="{{ "categories/unit-converters.html" | relURL }}" class="flex items-center gap-2 px-4 py-2 rounded-lg hover:bg-yellow-100 transition-colors"><i data-lucide="ruler" class="w-5 h-5 text-yellow-600"></i> Unit Converters</a>
              <a href="{{ "categories/security-tools.html" | relURL }}" class="flex items-center gap-2 px-4 py-2 rounded-lg hover:bg-indigo-100 transition-colors"><i data-lucide="shield" class="w-5 h-5 text-indigo-600"></i> Security & Encryption</a>
            </div>
            <a href="{{ "about.html" | relURL }}" class="flex items-center px-4 py-3 text-gray-700 hover:bg-gray-50 rounded-lg transition-colors">
              <i data-lucide="info" class="w-5 h-5 mr-3 text-indigo-600"></i>
              About
            </a>
            <a href="{{ "contact.html" | relURL }}" class="flex items-center px-4 py-3 text-gray-700 hover:bg-gray-50 rounded-lg transition-colors">
              <i data-lucide="mail" class="w-5 h-5 mr-3 text-red-600"></i>
              Contact
            </a>
            <a href="{{ "sitemap.html" | relURL }}" class="flex items-center px-4 py-3 text-gray-700 hover:bg-gray-50 rounded-lg transition-colors">
              <i data-lucide="network" class="w-5 h-5 mr-3 text-orange-600"></i>
              Sitemap
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</header>
<script>
  (function() {
    function initNav() {
      const catBtn = document.getElementById("categoriesDropdownBtn");
      const catDropdown = document.getElementById("categoriesDropdown");
      if (catBtn && catDropdown) {
        catBtn.addEventListener("click", function(e) {
          e.preventDefault();
          catDropdown.classList.toggle("hidden");
        });
        document.addEventListener("click", function(e) {
          if (!catDropdown.contains(e.target) && !catBtn.contains(e.target)) {
            catDropdown.classList.add("hidden");
          }
        });
      }
      const menuBtn = document.getElementById("mobileMenuBtn");
      const mobileMenu = document.getElementById("mobileMenu");
      const closeBtn = document.getElementById("mobileMenuCloseBtn");
      const mobileCatBtn = document.getElementById("mobileCategoriesBtn");
      const mobileCatDropdown = document.getElementById("mobileCategoriesDropdown");
      if (menuBtn && mobileMenu) {
        const toggleMenu = function(open) {
          if (open) {
            mobileMenu.classList.remove("translate-x-full");
            document.body.style.overflow = "hidden";
          } else {
            mobileMenu.classList.add("translate-x-full");
            document.body.style.overflow = "";
            if (mobileCatDropdown) {
              mobileCatDropdown.classList.add("hidden");
              const icon = mobileCatBtn.querySelector('[data-lucide="chevron-down"]');
              if (icon) icon.style.transform = "rotate(0deg)";
            }
          }
        };
        menuBtn.addEventListener("click", function() { toggleMenu(true); });
        closeBtn && closeBtn.addEventListener("click", function() { toggleMenu(false); });
        mobileMenu.addEventListener("click", function(e) {
          if (e.target === mobileMenu) toggleMenu(false);
        });
        if (mobileCatBtn && mobileCatDropdown) {
          mobileCatBtn.addEventListener("click", function() {
            mobileCatDropdown.classList.toggle("hidden");
            const icon = mobileCatBtn.querySelector('[data-lucide="chevron-down"]');
            if (icon) {
              icon.style.transform = mobileCatDropdown.classList.contains("hidden") ? "rotate(0deg)" : "rotate(180deg)";
            }
          });
        }
      }
    }
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", initNav);
    } else {
      initNav();
    }
  })();
</script>
