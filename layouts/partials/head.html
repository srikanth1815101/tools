<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>{{ if .Title }}{{ .Title }}{{ else }}{{ .Site.Title }}{{ end }}</title>
<meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ with .Params.description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}{{ end }}">

<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<!-- Google Fonts: Inter -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">

<!-- Tailwind CSS with Typography Plugin -->
<script src="https://cdn.tailwindcss.com?plugins=typography"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        colors: {
          primary: '#4A90E2',
          secondary: '#9B59B6',
          accent: '#FF6B35',
        },
        fontFamily: {
          sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
          mono: ['Fira Code', 'monospace'],
        },
        backgroundImage: {
          'gradient-primary': 'linear-gradient(135deg, #FF6B35 0%, #4A90E2 50%, #9B59B6 100%)',
          'gradient-secondary': 'linear-gradient(135deg, #4A90E2 0%, #9B59B6 100%)',
          'gradient-accent': 'linear-gradient(90deg, #FF6B35 0%, #FF8C5A 50%, #4A90E2 100%)',
          'gradient-warm': 'linear-gradient(135deg, #FF6B35 0%, #FF7F66 100%)',
          'gradient-cool': 'linear-gradient(135deg, #4A90E2 0%, #8B5CF6 100%)',
        },
        animation: {
          'fade-in-up': 'fadeInUp 1s cubic-bezier(0.25, 1, 0.5, 1) forwards',
          'fade-in': 'fadeIn 1.2s cubic-bezier(0.25, 1, 0.5, 1) forwards',
          'blob': 'blob 7s infinite',
          'pop-in': 'popIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards',
          'float': 'float 6s ease-in-out infinite',
          'gradient-x': 'gradient-x 15s ease infinite',
          'slide-up': 'slideUp 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards',
          'marquee': 'marquee 45s linear infinite',
        },
        keyframes: {
          fadeInUp: {
            '0%': { opacity: '0', transform: 'translateY(20px)' },
            '100%': { opacity: '1', transform: 'translateY(0)' },
          },
          fadeIn: {
            '0%': { opacity: '0' },
            '100%': { opacity: '1' },
          },
          blob: {
            '0%': { transform: 'translate(0px, 0px) scale(1)' },
            '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
            '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
            '100%': { transform: 'translate(0px, 0px) scale(1)' },
          },
          popIn: {
            '0%': { opacity: '0', transform: 'scale(0.8) translateY(10px)' },
            '100%': { opacity: '1', transform: 'scale(1) translateY(0)' },
          },
          float: {
            '0%, 100%': { transform: 'translateY(0)' },
            '50%': { transform: 'translateY(-20px)' },
          },
          'gradient-x': {
            '0%, 100%': { 'background-size': '200% 200%', 'background-position': 'left center' },
            '50%': { 'background-size': '200% 200%', 'background-position': 'right center' },
          },
          slideUp: {
            '0%': { opacity: '0', transform: 'translateY(30px)' },
            '100%': { opacity: '1', transform: 'translateY(0)' },
          },
          marquee: {
            '0%': { transform: 'translateX(0)' },
            '100%': { transform: 'translateX(-50%)' },
          },
        }
      }
    }
  };
</script>
<!-- Theme Init Script (DSA exact) -->
<script>
  (function () {
    const theme = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-theme', theme);
    if (theme === 'dark') {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
  })();
</script>
<!-- Lucide Icons CDN -->
<script src="https://unpkg.com/lucide@latest"></script>
<!-- Core IndexedDB Storage (DSA architecture) -->
<script src="{{ "js/db.js" | relURL }}"></script>
<!-- Core App Scripts (Data & State) -->
<script src="{{ "app.js" | relURL }}"></script>
<!-- Custom CSS & CSRGO Unified Brand System -->
<link rel="stylesheet" href="{{ "css/csrgo-brand.css" | relURL }}">
<link rel="stylesheet" href="{{ "css/styles.css" | relURL }}">

<!-- Favicon -->
<link rel="icon" href="https://tools.csrgo.com/favicon.ico" type="image/x-icon">
<link rel="shortcut icon" href="https://tools.csrgo.com/favicon.ico" type="image/x-icon">
<link rel="apple-touch-icon" sizes="180x180" href="https://tools.csrgo.com/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="https://tools.csrgo.com/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="https://tools.csrgo.com/favicon-16x16.png">
<link rel="manifest" href="https://tools.csrgo.com/site.webmanifest">

<!-- Open Graph / Social Media Meta Tags -->
<meta property="og:image" content="{{ "logo.png" | absURL }}">
<meta property="og:image:alt" content="CSRGO Tools Logo">
<meta property="og:title" content="{{ if .Title }}{{ .Title }}{{ else }}{{ .Site.Title }}{{ end }}">
<meta property="og:description" content="{{ with .Description }}{{ . }}{{ else }}{{ with .Params.description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}{{ end }}">

{{ if .IsHome }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "@id": "https://tools.csrgo.com/#organization",
  "url": "https://tools.csrgo.com",
  "name": "CSRGO Tools",
  "logo": {
    "@type": "ImageObject",
    "url": "https://tools.csrgo.com/logo.png",
    "width": "360",
    "height": "360"
  },
  "sameAs": [
    "https://tools.csrgo.com/about.html",
    "https://tools.csrgo.com/contact.html",
    "https://tools.csrgo.com/blog.html"
  ],
  "description": "Your one-stop destination for free online tools",
  "potentialAction": {
    "@type": "SearchAction",
    "target": "https://tools.csrgo.com/search?q={search_term_string}",
    "query-input": "required name=search_term_string"
  }
}
</script>
{{ else }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "url": "https://tools.csrgo.com/",
  "name": "CSRGO Tools",
  "logo": "https://tools.csrgo.com/logo.png"
}
</script>
{{ end }}

{{ range .Params.custom_styles }}
<link rel="stylesheet" href="{{ . }}">
{{ end }}

{{ with .Params.custom_css }}
<style>
{{ . | safeCSS }}
</style>
{{ end }}
