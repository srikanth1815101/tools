{{ define "main" }}
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 md:py-8 space-y-6 animate-fade-in-up">
  <h1 class="text-3xl md:text-4xl font-extrabold text-gray-900 dark:text-white tracking-tight">{{ .Title }}</h1>
  <div class="space-y-4">
    {{ range .Pages }}
    <div class="p-5 bg-white dark:bg-[#141B3D] border border-gray-100 dark:border-gray-700/50 rounded-2xl shadow-sm hover:shadow-md hover:border-blue-200 dark:hover:border-blue-800 transition-all">
      <a href="{{ .RelPermalink }}" class="text-blue-600 dark:text-fuchsia-400 hover:underline font-bold text-lg">{{ .Title }}</a>
      <p class="text-gray-600 dark:text-gray-400 mt-1 text-sm md:text-base leading-relaxed">{{ .Params.description }}</p>
    </div>
    {{ end }}
  </div>
</div>
{{ end }}
