{{ define "main" }}
<main class="flex-grow pt-28 pb-16 px-4">
  <div class="container mx-auto">
    <h1 class="text-3xl font-bold mb-6">{{ .Title }}</h1>
    <div class="space-y-4">
      {{ range .Pages }}
      <div class="p-4 bg-white rounded-lg shadow-sm">
        <a href="{{ .RelPermalink }}" class="text-blue-600 hover:underline font-semibold text-lg">{{ .Title }}</a>
        <p class="text-gray-600 mt-1">{{ .Params.description }}</p>
      </div>
      {{ end }}
    </div>
  </div>
</main>
{{ end }}
