<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  {{ partial "head.html" . }}
</head>
<body class="min-h-screen flex flex-col font-sans selection:bg-purple-500/30 selection:text-purple-600 bg-[#F8F9FA] dark:bg-[#0A0E27] text-gray-900 dark:text-gray-100">
  {{ partial "header.html" . }}

  <main class="{{ if .IsHome }}flex-grow{{ else }}pt-24 md:pt-28 flex-grow{{ end }}">
    {{ block "main" . }}{{ end }}
  </main>

  {{ partial "footer.html" . }}
  <!-- Go to Top Button exact as DSA -->
  <button id="goToTopBtn"
      class="fixed bottom-6 right-6 md:bottom-8 md:right-8 z-[101] hidden items-center justify-center w-12 h-12 rounded-full bg-gradient-to-br from-blue-500 to-indigo-600 text-white shadow-lg shadow-blue-500/30 hover:shadow-xl hover:-translate-y-1 active:scale-95 transition-all duration-300 opacity-0 transform translate-y-4"
      aria-label="Scroll to top">
      <i data-lucide="chevron-up" class="w-6 h-6"></i>
  </button>
  {{ partial "scripts.html" . }}
</body>
</html>
